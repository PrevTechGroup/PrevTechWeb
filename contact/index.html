<!doctype html>
<html><head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Contact — PrevTech Group</title>
  <link rel="stylesheet" href="../assets/css/style.css"/>
</head><body>
<header class="site-header">
  <div class="container navbar">
    <div class="nav-left">
      <a href="../index.html"><img src="../assets/img/logo.jpg" alt="PrevTech Group" class="logo"/></a>
      <nav><a data-i18n="nav.home" href="../index.html"></a><a data-i18n="nav.divisions" href="../divisions/index.html"></a><a data-i18n="nav.projects" href="../projects.html"></a><a data-i18n="nav.about" href="../about/index.html"></a><a data-i18n="nav.contact" href="../contact/index.html" class="active"></a></nav>
    </div>
    <div style="display:flex;align-items:center;gap:12px">
      <div class="lang-switch" role="group" aria-label="Language">
        <button id="btn-en" aria-pressed="true">EN</button>
        <button id="btn-es" aria-pressed="false">ES</button>
      </div>
      <a class="btn-primary" data-i18n="cta.quote" href="../contact/index.html"></a>
    </div>
  </div>
</header>
<section class="container hero">
  <h1 class="h1" data-i18n="contact.title"></h1>
  <div class="grid cols-2">
    <div class="card">
      <h3 class="h2" data-i18n="contact.form"></h3>
      <p class="p" data-i18n="contact.form.desc"></p>
      <form onsubmit="event.preventDefault(); alert('Thanks! We will contact you.');">
        <label class="p" data-i18n="contact.name"></label>
        <input style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px"/>
        <label class="p" data-i18n="contact.email" style="margin-top:14px;display:block"></label>
        <input type="email" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px"/>
        <label class="p" data-i18n="contact.phone" style="margin-top:14px;display:block"></label>
        <input style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px"/>
        <label class="p" data-i18n="contact.subject" style="margin-top:14px;display:block"></label>
        <input style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px"/>
        <label class="p" data-i18n="contact.message" style="margin-top:14px;display:block"></label>
        <textarea rows="6" style="width:100%;padding:12px;border:1px solid var(--border);border-radius:10px"></textarea>
        <div style="margin-top:14px"><button class="btn-primary" type="submit">Send</button></div>
      </form>
    </div>
    <div class="card">
      <h3 class="h2" data-i18n="contact.company"></h3>
      <p class="p"><span data-i18n="contact.city"></span></p>
      <p class="p"><a href="mailto:carmelo.gonzalez@prevtechgroup.com">carmelo.gonzalez@prevtechgroup.com</a></p>
      <div class="card" style="margin-top:10px">
        <h4 class="h2" data-i18n="contact.area"></h4>
        <p class="p" data-i18n="contact.area.desc"></p>
        <div class="placeholder"></div>
      </div>
    </div>
  </div>
</section>
<footer class="site-footer">
  <div class="container inner">
    <div>
      <div class="p">PrevTech Group LLC — <span data-i18n="footer.tagline"></span></div>
      <div class="p"><span data-i18n="footer.addr"></span> · <a href="mailto:carmelo.gonzalez@prevtechgroup.com" data-i18n="footer.email"></a></div>
    </div>
    <div>
      <span class="badge">PR</span>
    </div>
  </div>
  <script src="../assets/js/app.js"></script>
</footer>
</body></html>
