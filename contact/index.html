<!-- Contact Form -->
<form id="contact-form" action="https://formspree.io/f/myzlzoyw" method-en="Name" data-lang-es="Nombre">Nombre</label>
    <input type="text" id="name" name="name" required>
  </div>

  <div>
    <label for="email" data-lang-en="Email" data-lang-es="Correo">Correo</label>
    <input type="email" id="email" name="email" required>
  </div>

  <div>
    <label for="phone" data-lang-en="Phone" data-lang-es="Teléfono">Teléfono</label>
    <input type="tel" id="phone" name="phone">
  </div>

  <div>
    <label for="message" data-lang-en="Message" data-lang-es="Mensaje">Mensaje</label>
    <textarea id="message" name="message" required></textarea>
  </div>

  <button type="submit" data-lang-en="Send" data-lang-es="Enviar">Enviar</button>
</form>

<!-- Success Message -->
<div id="form-success" style="display:none;" data-lang-en="Your message has been sent successfully!" data-lang-es="¡Tu mensaje ha sido enviado exitosamente!">
  ¡Tu mensaje ha sido enviado exitosamente!
</div>

<script>
  // Detect language based on page or browser
  const lang = document.documentElement.lang || 'es';
  document.querySelectorAll('[data-lang-en]').forEach(el => {
    el.textContent = lang.startsWith('en') ? el.getAttribute('data-lang-en') : el.getAttribute('data-lang-es');
  });

  // Handle form submission
  const form = document.getElementById('contact-form');
  const successDiv = document.getElementById('form-success');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const formData = new FormData(form);
    const response = await fetch(form.action, {
      method: 'POST',
      body: formData,
      headers: { 'Accept': 'application/json' }
    });

    if (response.ok) {
      form.style.display = 'none';
      successDiv.style.display = 'block';
    } else {
      alert(lang.startsWith('en') ? 'Error sending message.' : 'Error al enviar el mensaje.');
    }
  });
</script>
