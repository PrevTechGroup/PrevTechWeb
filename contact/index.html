<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - PrevTech Group</title>
    <link rel="stylesheet" href="../assets/style.css"> <!-- Mantener estilos originales -->
</head>
<body>
    <header class="navbar">
        <div class="logo">PrevTech Group</div>
        <nav>
            <a href="../index.html">Inicio</a>
            <a href="../about.html">Nosotros</a>
            <a href="index.html" class="active">Contacto</a>
        </nav>
    </header>

    <main class="container" style="max-width:800px;margin:auto;padding:20px;">
        <h1>Contáctanos</h1>
        <p>Complete el siguiente formulario y nos pondremos en contacto con usted lo antes posible.</p>

        <!-- Formulario funcional con Formspree -->
        <form action="https://formspree.io/f/myzlzoyw" method="POST" class="contact-form">
            <div class="form-group">
                <label for="name">Nombre*</label>
                <input type="text" id="name" name="name" required>
            </div>
            <div class="form-group">
                <label for="email">Correo*</label>
                <input type="email" id="email" name="email" required>
            </div>
            <div class="form-group">
                <label for="service">Servicio</label>
                <select id="service" name="service">
                    <option value="Maintenance">Mantenimiento</option>
                    <option value="Projects">Proyectos</option>
                    <option value="Energy">Energía</option>
                </select>
            </div>
            <div class="form-group">
                <label for="message">Mensaje</label>
                <textarea id="message" name="message" rows="5" required></textarea>
            </div>
            <button type="submit" class="btn btn-primary">Enviar</button>
        </form>

        <p style="margin-top:15px;font-size:14px;color:#555;">Al enviar este formulario, acepta nuestra política de privacidad.</p>
    </main>

    <footer style="text-align:center;padding:20px;background:#f4f4f4;margin-top:40px;">
        <p>&copy; 2025 PrevTech Group. Todos los derechos reservados.</p>
    </footer>
</body>
</html>
