name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main  # Se ejecuta cuando haces push a la rama main

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    steps:
      - uses: actions/checkout@v3

      - name: Build And Deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Para integraciones con GitHub
          action: "upload"
          app_location: "/" # Carpeta raíz donde está index.html
          output_location: "" # No hay carpeta de build para HTML puro
