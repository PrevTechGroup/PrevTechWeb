<form
class="contact-form"
action="https://formsubmit.co/info@prevtechgroup.com"
method="POST"
>

<input
type="hidden"
name="_subject"
value="New Website Inquiry | PREVTECH GROUP">

<input
type="hidden"
name="_template"
value="table">

<input
type="hidden"
name="_next"
value="https://www.prevtechgroup.com/thankyou.html">

<input
type="hidden"
name="_autoresponse"
value="Thank you for contacting PREVTECH GROUP. We have received your inquiry and a member of our team will review it shortly. We typically respond within one business day. For urgent matters, please email us directly at info@prevtechgroup.com.">

<input
type="text"
name="_honey"
style="display:none"
tabindex="-1"
autocomplete="off">

<div class="form-row">

<input
type="text"
name="name"
placeholder="Full Name"
required>

<input
type="email"
name="email"
placeholder="Email Address"
required>

</div>

<div class="form-row">

<input
type="tel"
name="phone"
placeholder="Phone">

<input
type="text"
name="company"
placeholder="Company">

</div>

<select name="service" required>

<option value="" selected disabled>
Service Interest
</option>

<option value="Industrial Services">
Industrial Services
</option>

<option value="Marine">
Marine
</option>

<option value="EcoPower">
EcoPower
</option>

<option value="General Inquiry">
General Inquiry
</option>

</select>

<textarea
name="message"
placeholder="Tell us about your project"
required></textarea>

<button type="submit" class="btn-primary">
Send Message
</button>

</form>
